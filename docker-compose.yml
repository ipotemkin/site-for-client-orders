# Infrastructure: Nginx | Postgres | pgAdmin | Registry | Watchtower
# Backend is commented out until the image is ready.
#
# Networks:
#   edge     — public entry (Nginx, Registry)
#   internal — isolated (Postgres, pgAdmin, Backend)
#
# Security:
#   - Postgres has no published ports
#   - Backend will not publish ports (API only via Nginx)
#   - Client data stays inside the internal network

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pgadmin
      - backend
      - frontend
    networks:
      - edge
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # No ports: DB is reachable only from internal network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  pgadmin:
    # Pin exact tag: floating :8 + Watchtower breaks the SQLite
    # schema (e.g. missing server.tunnel_keep_alive).
    image: dpage/pgadmin4:8.14
    container_name: pgadmin
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/pgadmin-init/entrypoint.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      # Served under http://<host>/pgadmin/ via Nginx
      SCRIPT_NAME: /pgadmin
      # Do not expose pgAdmin directly; only via Nginx
      PGADMIN_LISTEN_ADDRESS: "0.0.0.0"
      # servers.json path (written by pgadmin/entrypoint.sh)
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      # Used by pgadmin/entrypoint.sh to build servers.json + pgpass
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/entrypoint.sh:/pgadmin-init/entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    labels:
      # Do not auto-upgrade: SQLite migrations are fragile
      - "com.centurylinklabs.watchtower.enable=false"

  # Local Docker Registry — pull/push from developer machines.
  # Auth: docker login <host>:${REGISTRY_PORT}
  # (htpasswd file, see README)
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    # Public access disabled — uncomment to expose again:
    # ports:
    #   - "${REGISTRY_PORT:-5000}:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
      - ./registry/auth:/auth:ro
    networks:
      - edge
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Auto-updates containers when a newer image appears
  # (e.g. after push to the local registry).
  # nickfedor/watchtower: maintained fork; works with Docker 29+
  # (API >= 1.44). containrrr/watchtower is unmaintained and fails.
  watchtower:
    image: nickfedor/watchtower:1.23.1
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./registry/auth:/auth:ro
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      WATCHTOWER_LABEL_ENABLE: "true"
      # Credentials for the private registry
      REPO_USER: ${REGISTRY_USER}
      REPO_PASS: ${REGISTRY_PASSWORD}
    networks:
      - edge
    labels:
      # Watchtower should not update itself by label filter
      # unless you want that; leave disabled by default.
      - "com.centurylinklabs.watchtower.enable=false"

  # ------------------------------------------------------------------
  # Backend (FastAPI) — private: no host ports published.
  # Reachable only on network `internal` (Nginx → backend:8000).
  # Temporary: build from ./backend context (registry image commented).
  # ------------------------------------------------------------------
  backend:
    # image: ${REGISTRY_HOST}:${REGISTRY_PORT}/backend:${BACKEND_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # If Docker Hub returns 429, set in .env:
        #   BACKEND_BASE_IMAGE=backend:local
        PYTHON_IMAGE: ${BACKEND_BASE_IMAGE:-python:3.12-slim}
    image: backend:local
    container_name: backend
    restart: unless-stopped
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    # Intentionally no `ports:` — do not expose API on the host.
    labels:
      # Local build: do not let Watchtower replace with registry
      - "com.centurylinklabs.watchtower.enable=false"

  # ------------------------------------------------------------------
  # Frontend (React) — private: no host ports published.
  # Served only via Nginx on location /.
  # Temporary: build from ./frontend context.
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:local
    container_name: frontend
    restart: unless-stopped
    networks:
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  pgadmin_data:
  registry_data:
