worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 32m;

    # Hide upstream version headers
    server_tokens off;

    # ----------------------------------------------------------
    # Public entry: Frontend + API (via Backend) + pgAdmin
    # Backend is never exposed on the host — only this proxy.
    # ----------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Health for orchestration / uptime checks
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # pgAdmin — public access disabled. Uncomment to expose again.
        # With SCRIPT_NAME=/pgadmin the upstream must receive the
        # full path (/pgadmin/...), so proxy_pass has no URI suffix.
        # location = /pgadmin {
        #     return 301 /pgadmin/;
        # }
        #
        # location /pgadmin/ {
        #     proxy_set_header X-Script-Name /pgadmin;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_pass http://pgadmin:80;
        #     proxy_redirect off;
        # }

        # ------------------------------------------------------
        # Backend API — public edge proxy disabled.
        # API is proxied inside the frontend container instead
        # (see frontend/nginx.conf), so the SPA keeps working.
        # To restore direct edge proxy, uncomment below.
        # ------------------------------------------------------
        # location = /api {
        #     return 301 /api/health;
        # }
        #
        # location /api/ {
        #     proxy_pass http://backend:8000/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For
        #         $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header X-Forwarded-Prefix /api;
        # }

        # ------------------------------------------------------
        # Frontend (React SPA) + /api via frontend nginx
        # ------------------------------------------------------
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
